[package]
name = "omnirust"
version = "0.1.0"
edition = "2021"

[dependencies]
async-graphql = "4.0"
tokio-tungstenite = "0.16"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cached = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
config = "0.13"  # Ensure this is present

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
