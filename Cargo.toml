[package]
name = "omnirust"
version = "0.1.0"
edition = "2021"

[dependencies]
async-graphql = "7.0.16"
tokio-tungstenite = "0.26.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cached = "0.55.1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0.12"
anyhow = "1.0"
config = "0.15.11"  # Ensure this is present
chrono = "0.4"
toml = "0.8"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5"
tonic = "0.13.1"
prost = "0.13.5"
prost-types = "0.13.5"
futures-util = "0.3" # For StreamExt, SinkExt
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "offline"] }

[build-dependencies]
tonic-build = { version = "0.13.1", features = ["prost"] }
prost-build = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3.0"
wiremock = "0.6"
