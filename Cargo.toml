[workspace]
members = [
    ".", # The root package (omnirust library)
    "sample", # The sample application
]
resolver = "2" # Recommended for workspaces

[package]
name = "omnirust"
version = "0.1.0"
edition = "2021"

[dependencies]
async-graphql = "7.0.16"
tokio-tungstenite = "0.26.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cached = "0.55.1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0.12"
anyhow = "1.0"
config = "0.15.11"  # Ensure this is present
chrono = "0.4"
toml = "0.8"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5"
tonic = "0.11.0"
prost = "0.12.3"
prost-types = "0.12.3"
futures-util = "0.3" # For StreamExt, SinkExt
async-stream = "0.3" # For GraphQL Subscriptions
async-trait = "0.1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros"] }
ndarray = { version = "0.15", features = ["serde"] }
ndarray-linalg = "0.16" # For linear algebra in ML - trying without explicit BLAS feature
num-traits = "0.2"
axum = "0.7"
once_cell = "1.19"
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4" # For direct Askama template response type in Axum
wasm-bindgen = "0.2" # Optional, only if compiling parts of the lib to Wasm
clap = { version = "4.5", features = ["derive"] }
ratatui = { version = "0.27", features = ["all-widgets", "crossterm"] }
crossterm = "0.27"
libloading = "0.8" # For dynamic plugin loading
validator = { version = "0.18", features = ["derive"] } # For input validation

[build-dependencies]
tonic-build = { version = "0.11.0", features = ["prost"] }
prost-build = "0.12.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3.0"
wiremock = "0.6"
hyper = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
